<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faqat Mening Bibiyim Uchun 💖</title>
    <!-- CSS Fayl ulanishi -->
    <link rel="stylesheet" href="style.css">
    <!-- Confetti kutubxonasi -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
</head>
<body>

    <!-- Jonli yulduzli va yurakli fon -->
    <div class="stars" id="starsContainer"></div>

    <!-- FON MUSIQASI (Fayl nomi to'g'rilandi va autoplay moslashtirildi) -->
    <audio id="bgMusic" loop preload="auto">
        <source src="assets/music/music.mp3.mp3" type="audio/mpeg">
        <source src="assets/music/music.mp3" type="audio/mpeg">
    </audio>

    <!-- 1. INTRO KOD SO'RASH EKRANI -->
    <div id="lockScreen" class="screen">
        <div class="glass-card">
            <h1>🔒 Faqat Mening Bibiyim Uchun</h1>
            <p style="color: #ffb199; font-size: 13px; margin-top: 5px;">Qalbimiz kalitini kiriting:</p>
            <input type="text" id="passCode" placeholder="abdulhodiy and robiya love">
            <button class="btn-romantic" onclick="checkCode()">Qalbimga kirish 💖</button>
            <p id="errorMsg" style="color: #ff4d4d; font-size: 12px; margin-top: 10px;"></p>
        </div>
    </div>

    <!-- 2. ASOSIY SAYT QISMI -->
    <div id="mainContent" style="display: none;">
        
        <!-- YURAK SLEYDSHOU QISMI (Katta va romantik) -->
        <div class="slideshow-container">
            <div class="slide fade">
                <img src="assets/images/1.jpg" alt="Rasm 1" onerror="this.src='https://picsum.photos/800/600?random=1'">
                <div class="slide-caption">Bizning Eng Shirin Damlarimiz ✨</div>
            </div>
            <div class="slide fade">
                <img src="assets/images/2.jpg" alt="Rasm 2" onerror="this.src='https://picsum.photos/800/600?random=2'">
                <div class="slide-caption">Cheksiz Sevgi va Mehr 💕</div>
            </div>
            <div class="slide fade">
                <img src="assets/images/3.jpg" alt="Rasm 3" onerror="this.src='https://picsum.photos/800/600?random=3'">
                <div class="slide-caption">Har Bir Soniyamiz Qadrli 🌹</div>
            </div>

            <!-- Sleydshou tugmalari -->
            <a class="prev" onclick="changeSlide(-1)">&#10094;</a>
            <a class="next" onclick="changeSlide(1)">&#10095;</a>
        </div>

        <!-- LOVE COUNTER (SEVGI TAYMERI) -->
        <section class="section">
            <h2 style="font-family: 'Playfair Display', serif; color: #ff758c;">Bizning Abadiyatimiz ⏳</h2>
            <p style="color: #ccc; font-size: 12px; margin-top: 5px;">03.03.2026 dan beri birgamiz:</p>
            
            <div class="counter-grid">
                <div class="time-box"><span id="days">0</span><p>Kun</p></div>
                <div class="time-box"><span id="hours">0</span><p>Soat</p></div>
                <div class="time-box"><span id="minutes">0</span><p>Daqiqa</p></div>
                <div class="time-box"><span id="seconds">0</span><p>Soniya</p></div>
            </div>
        </section>

        <!-- MUSIQA PLEYERI WIDGETI -->
        <div class="music-player">
            <div style="display: flex; align-items: center; gap: 12px;">
                <div class="vinyl" id="vinylIcon"></div>
                <div style="text-align: left;">
                    <p style="font-size: 13px; font-weight: 600; margin: 0; color: #fff;">Bizning Qo'shig'imiz ❤️</p>
                    <p style="font-size: 11px; color: #aaa; margin: 0;">Abdulhodiy & Robiya</p>
                </div>
            </div>
            <button id="playBtn" class="btn-play" onclick="toggleAudio()">⏸</button>
        </div>

    </div>

    <!-- JS Fayl ulanishi -->
    <script src="script.js"></script>
</body>
</html>
